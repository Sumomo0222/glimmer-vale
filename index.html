<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b3a2f">
<meta name="description" content="微光谷物语 - 原创像素风农场生活模拟游戏：清理荒废农场、耕种收获、钓鱼、建造设施、结识村民，逐步恢复小镇。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>微光谷物语 · Glimmer Vale</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E">
<style>
/* ============ 微光谷物语 · Glimmer Vale ============ */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { width:100%; height:100%; overflow:hidden; background:#151a14; }
body { font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  user-select:none; -webkit-user-select:none; touch-action:none; overscroll-behavior:none; }
#app { position:fixed; inset:0; }
canvas { image-rendering:pixelated; image-rendering:crisp-edges; }
#game { position:absolute; inset:0; width:100%; height:100%; display:block; background:#0e130d; }
.hidden { display:none !important; }
.ui { position:absolute; z-index:10; }

/* ---------- HUD ---------- */
#hud { top:0; left:0; right:0; padding:8px 10px; display:flex; justify-content:space-between;
  pointer-events:none; padding-top:calc(8px + env(safe-area-inset-top)); }
#hud-left, #hud-right { display:flex; flex-direction:column; gap:5px; }
#hud-right { align-items:flex-end; }
#hud-date, #hud-clock, #hud-gold, #hud-energy {
  background:rgba(20,26,18,.82); border:2px solid #5b4632; border-radius:8px;
  color:#f4e9c8; font-size:13px; padding:4px 10px; width:max-content;
  text-shadow:1px 1px 0 #000; box-shadow:0 2px 0 rgba(0,0,0,.4); }
#hud-clock { font-size:17px; letter-spacing:1px; }
#hud-date span { margin-right:6px; }
#hud-weather { margin-left:2px; }
#hud-gold { display:flex; align-items:center; gap:6px; font-size:15px; }
.coin { width:14px; height:14px; display:inline-block; border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #ffe98a, #d9a521 65%, #8a6410); border:1px solid #8a6410; }
#hud-energy { position:relative; width:130px; height:22px; padding:0; overflow:hidden; }
#energy-fill { position:absolute; inset:2px; width:100%; transform-origin:left;
  background:linear-gradient(#8fd45a,#4d9934); border-radius:5px; transition:transform .3s; }
#energy-text { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:12px; color:#fff; text-shadow:1px 1px 0 #000; }
#hud-btns { display:flex; gap:6px; pointer-events:auto; }
.icon-btn { width:40px; height:40px; font-size:19px; border:2px solid #5b4632; border-radius:9px;
  background:rgba(20,26,18,.85); color:#f4e9c8; cursor:pointer; box-shadow:0 2px 0 rgba(0,0,0,.4); }
.icon-btn:active { transform:translateY(2px); box-shadow:none; }

/* ---------- 快捷栏 ---------- */
#hotbar { bottom:calc(10px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
  display:flex; gap:6px; }
.hb-slot { width:52px; height:52px; border:2px solid #5b4632; border-radius:10px;
  background:rgba(20,26,18,.85); position:relative; display:flex; align-items:center; justify-content:center; }
.hb-slot.sel { border-color:#ffd964; background:rgba(60,50,20,.9); box-shadow:0 0 8px rgba(255,217,100,.5); }
.hb-slot canvas { width:40px; height:40px; pointer-events:none; }
.hb-slot .cnt { position:absolute; right:3px; bottom:1px; font-size:11px; color:#fff; text-shadow:1px 1px 0 #000; }
.hb-slot .key { position:absolute; left:4px; top:1px; font-size:10px; color:#cbb98a; }
.hb-slot .name { position:absolute; top:-20px; left:50%; transform:translateX(-50%); white-space:nowrap;
  font-size:10px; color:#f4e9c8; text-shadow:1px 1px 0 #000; display:none; }
.hb-slot.sel .name { display:block; }

/* ---------- 触屏控件 ---------- */
#joystick { left:16px; bottom:calc(70px + env(safe-area-inset-bottom)); }
#joy-base { width:120px; height:120px; border-radius:50%; background:rgba(20,26,18,.45);
  border:2px solid rgba(244,233,200,.35); position:relative; }
#joy-stick { width:52px; height:52px; border-radius:50%; background:rgba(244,233,200,.7);
  position:absolute; left:32px; top:32px; border:2px solid rgba(91,70,50,.6); }
#action-btns { right:16px; bottom:calc(76px + env(safe-area-inset-bottom)); display:flex; gap:12px; align-items:flex-end; }
.round-btn { width:64px; height:64px; border-radius:50%; border:3px solid #5b4632;
  background:rgba(48,60,40,.9); color:#f4e9c8; font-size:16px; font-weight:bold;
  box-shadow:0 3px 0 rgba(0,0,0,.45); cursor:pointer; }
#btn-act { background:rgba(140,80,40,.92); width:74px; height:74px; font-size:18px; }
.round-btn:active { transform:translateY(3px); box-shadow:none; }

/* ---------- 面板 ---------- */
#panel-wrap { position:absolute; inset:0; z-index:30; background:rgba(8,10,8,.6);
  display:flex; align-items:center; justify-content:center; padding:14px; }
#panel-wrap.above { z-index:60; }
#panel { width:min(560px, 94vw); max-height:86vh; background:#2a2317; border:3px solid #6b5334;
  border-radius:14px; display:flex; flex-direction:column; box-shadow:0 8px 24px rgba(0,0,0,.6); }
#panel-head { display:flex; justify-content:space-between; align-items:center;
  padding:10px 14px; border-bottom:2px solid #6b5334; }
#panel-title { color:#ffd964; font-size:17px; font-weight:bold; letter-spacing:2px; }
#panel-close { background:none; border:none; color:#cbb98a; font-size:18px; cursor:pointer; padding:2px 8px; }
#panel-body { padding:12px 14px; overflow-y:auto; color:#f4e9c8; font-size:14px; line-height:1.6;
  -webkit-overflow-scrolling:touch; touch-action:pan-y; }

/* 对话框 */
#dialog { position:absolute; left:50%; bottom:calc(90px + env(safe-area-inset-bottom));
  transform:translateX(-50%); width:min(560px, 92vw); z-index:25; background:rgba(24,20,12,.94);
  border:3px solid #6b5334; border-radius:12px; padding:12px 16px 10px; cursor:pointer; }
#dialog-name { color:#ffd964; font-size:14px; font-weight:bold; margin-bottom:4px; }
#dialog-text { color:#f4e9c8; font-size:15px; line-height:1.6; min-height:44px; }
#dialog-next { text-align:right; color:#8fa06b; font-size:12px; margin-top:4px; animation:bob 1s infinite; }
@keyframes bob { 50% { transform:translateY(3px); } }

/* 背包网格 */
.inv-grid { display:grid; grid-template-columns:repeat(auto-fill, 58px); gap:8px; justify-content:center; }
.inv-slot { width:58px; height:58px; border:2px solid #5b4632; border-radius:9px; background:#1e180e;
  position:relative; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.inv-slot.sel { border-color:#ffd964; }
.inv-slot canvas { width:44px; height:44px; }
.inv-slot .cnt { position:absolute; right:3px; bottom:1px; font-size:11px; color:#fff; text-shadow:1px 1px 0 #000; }
.inv-empty { text-align:center; color:#8a7c5c; padding:30px 0; }
.inv-info { margin-top:10px; min-height:38px; font-size:13px; color:#cbb98a; border-top:1px dashed #5b4632; padding-top:8px; }
.inv-info b { color:#ffd964; }
.item-row { display:flex; justify-content:space-between; align-items:center; padding:7px 4px;
  border-bottom:1px dashed #4a3a24; gap:8px; }
.item-row .nm { display:flex; align-items:center; gap:8px; }
.item-row canvas { width:30px; height:30px; }
.item-row .pr { color:#ffd964; white-space:nowrap; }
.btn { display:inline-block; background:#7c5a2e; border:2px solid #a5793c; color:#ffe9b8; border-radius:8px;
  padding:6px 14px; font-size:13px; cursor:pointer; box-shadow:0 2px 0 rgba(0,0,0,.4); }
.btn:active { transform:translateY(2px); box-shadow:none; }
.btn.primary { background:#3f7d3a; border-color:#5aa254; }
.btn.danger { background:#8c3b30; border-color:#b45a4c; }
.btn:disabled { opacity:.45; pointer-events:none; }

/* 任务 */
.q-item { border:2px solid #4a3a24; border-radius:10px; padding:10px 12px; margin-bottom:10px; background:#221c10; }
.q-item.done { border-color:#5a7d3a; opacity:.75; }
.q-name { color:#ffd964; font-weight:bold; font-size:14px; display:flex; justify-content:space-between; }
.q-name .tag { font-size:11px; padding:1px 8px; border-radius:8px; background:#5a4632; color:#ffe9b8; }
.q-item.done .tag { background:#3f6d2a; }
.q-desc { font-size:13px; color:#cbb98a; margin-top:4px; }
.q-prog { margin-top:6px; height:10px; background:#171208; border-radius:5px; overflow:hidden; border:1px solid #4a3a24; }
.q-prog i { display:block; height:100%; background:linear-gradient(#8fd45a,#4d9934); }
.q-reward { font-size:12px; color:#8fa06b; margin-top:4px; }

/* 地图面板 */
.map-canvas-wrap { display:flex; justify-content:center; }
#mini-map { width:min(480px, 88vw); border:2px solid #6b5334; border-radius:10px; }
.npc-list { margin-top:10px; }
.npc-row { display:flex; justify-content:space-between; padding:5px 2px; font-size:13px;
  border-bottom:1px dashed #4a3a24; }
.npc-row .loc { color:#8fd45a; }
.npc-row .away { color:#8a7c5c; }
.npc-dot { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }

/* 结算 */
.settle-day { text-align:center; color:#ffd964; font-size:18px; letter-spacing:2px; margin-bottom:10px; }
.settle-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.settle-cell { background:#221c10; border:2px solid #4a3a24; border-radius:10px; padding:8px 10px; text-align:center; }
.settle-cell .v { font-size:20px; color:#ffd964; font-weight:bold; }
.settle-cell .k { font-size:12px; color:#cbb98a; }
.settle-log { margin-top:10px; font-size:12px; color:#a89a78; max-height:120px; overflow-y:auto;
  border-top:1px dashed #4a3a24; padding-top:8px; }
.progress-big { margin:10px 0; }
.progress-big .bar { height:16px; background:#171208; border:2px solid #4a3a24; border-radius:8px; overflow:hidden; }
.progress-big .bar i { display:block; height:100%; background:linear-gradient(90deg,#5aa254,#ffd964); transition:width .6s; }
.progress-big .lbl { font-size:12px; color:#cbb98a; margin-top:4px; text-align:center; }

/* 菜单 */
.menu-list { display:flex; flex-direction:column; gap:10px; padding:6px 4px; }
.menu-list .menu-btn { width:100%; }

/* 开始画面 */
#start-screen { position:absolute; inset:0; z-index:50; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:8px; background:#151a14; overflow:hidden; }
#start-canvas { width:100%; height:100%; position:absolute; inset:0; object-fit:cover; opacity:.95; }
#start-title { position:relative; text-align:center; margin-bottom:4px; text-shadow:0 3px 0 rgba(0,0,0,.55); }
#start-title h1 { font-size:clamp(34px, 9vw, 64px); color:#ffe9b8; letter-spacing:10px;
  text-shadow:0 4px 0 #3a2c1a, 0 0 24px rgba(255,217,100,.35); }
#start-title .en { font-size:clamp(12px, 3vw, 18px); color:#8fd45a; letter-spacing:8px; margin-top:2px; }
#start-title .sub { font-size:clamp(11px, 2.6vw, 14px); color:#cbb98a; margin-top:8px; letter-spacing:4px; }
#start-btns { position:relative; display:flex; flex-direction:column; gap:12px; margin-top:16px; }
.menu-btn { min-width:min(260px, 70vw); padding:12px 20px; font-size:17px; border-radius:12px;
  border:3px solid #6b5334; background:rgba(42,35,23,.92); color:#ffe9b8; cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.45); letter-spacing:3px; }
.menu-btn.small { min-width:min(200px,50vw); font-size:13px; padding:9px 16px; letter-spacing:2px; }
.menu-btn:active { transform:translateY(3px); box-shadow:none; }
#btn-continue { border-color:#5aa254; }
#start-foot { position:relative; margin-top:18px; font-size:11px; color:#d8cba6; text-align:center;
  padding:0 16px; text-shadow:0 1px 2px rgba(0,0,0,.8); }

/* 钓鱼 */
#fishing { position:absolute; inset:0; z-index:28; display:flex; flex-direction:column;
  align-items:center; justify-content:center; background:rgba(8,12,20,.45); }
#fish-canvas { width:min(240px, 56vw); background:#1d3040; border:4px solid #6b5334; border-radius:14px; }
#fish-tip { margin-top:12px; color:#f4e9c8; font-size:13px; background:rgba(20,26,18,.85);
  padding:6px 14px; border-radius:8px; }

/* 提示 */
#toasts { position:absolute; top:calc(120px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
  z-index:40; display:flex; flex-direction:column; gap:6px; align-items:center; pointer-events:none; width:100%; }
body.touch-ui #toasts { top:calc(190px + env(safe-area-inset-top)); }
.toast { background:rgba(24,20,12,.92); border:2px solid #6b5334; color:#ffe9b8; font-size:13px;
  padding:7px 16px; border-radius:20px; animation:toast-in .25s; max-width:86vw; text-align:center; }
.toast.good { border-color:#5aa254; color:#d6f5c8; }
.toast.bad { border-color:#b45a4c; color:#ffd6cc; }
@keyframes toast-in { from { opacity:0; transform:translateY(-8px);} }
#tile-hint { position:absolute; z-index:15; background:rgba(24,20,12,.9); border:2px solid #6b5334;
  color:#ffe9b8; font-size:12px; padding:4px 10px; border-radius:8px; pointer-events:none;
  transform:translate(-50%, -100%); white-space:nowrap; }

/* 帮助 */
.help-sec { margin-bottom:12px; }
.help-sec h3 { color:#ffd964; font-size:14px; margin-bottom:4px; }
.help-sec p { font-size:13px; color:#cbb98a; }
kbd { background:#171208; border:1px solid #5b4632; border-radius:4px; padding:0 6px;
  font-size:12px; color:#ffe9b8; font-family:inherit; }

@media (max-width: 720px) {
  #hud-date, #hud-gold { font-size:12px; }
  #hud-energy { width:100px; }
  .icon-btn { width:36px; height:36px; font-size:16px; }
  .hb-slot { width:46px; height:46px; }
  .hb-slot canvas { width:36px; height:36px; }
  #hotbar { bottom:calc(8px + env(safe-area-inset-bottom)); }
  #dialog { bottom:calc(150px + env(safe-area-inset-bottom)); }
}
body.touch-ui #joystick { display:block; }
body.touch-ui #action-btns { display:flex; }

</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- 顶部HUD -->
  <div id="hud" class="ui hidden">
    <div id="hud-left">
      <div id="hud-date">
        <span id="hud-season"></span><span id="hud-day"></span><span id="hud-year"></span>
        <span id="hud-weather"></span>
      </div>
      <div id="hud-clock">6:00</div>
    </div>
    <div id="hud-right">
      <div id="hud-gold"><span class="coin"></span><span id="gold-num">0</span></div>
      <div id="hud-energy"><div id="energy-fill"></div><span id="energy-text">100</span></div>
      <div id="hud-btns">
        <button class="icon-btn" id="btn-bag" title="背包 (I)">🎒</button>
        <button class="icon-btn" id="btn-quest" title="任务 (J)">📜</button>
        <button class="icon-btn" id="btn-map" title="地图 (M)">🗺️</button>
        <button class="icon-btn" id="btn-menu" title="菜单 (Esc)">⚙️</button>
      </div>
    </div>
  </div>

  <!-- 快捷栏 -->
  <div id="hotbar" class="ui hidden"></div>

  <!-- 摇杆与按键（触屏） -->
  <div id="joystick" class="ui hidden"><div id="joy-base"><div id="joy-stick"></div></div></div>
  <div id="action-btns" class="ui hidden">
    <button id="btn-tool" class="round-btn">工具</button>
    <button id="btn-act" class="round-btn">互动</button>
  </div>

  <!-- 对话框 -->
  <div id="dialog" class="panel hidden">
    <div id="dialog-name"></div>
    <div id="dialog-text"></div>
    <div id="dialog-next">▼ 继续</div>
  </div>

  <!-- 通用面板（背包/任务/地图/菜单/商店/建造/出售/结算） -->
  <div id="panel-wrap" class="hidden">
    <div id="panel">
      <div id="panel-head"><span id="panel-title"></span><button id="panel-close">✕</button></div>
      <div id="panel-body"></div>
    </div>
  </div>

  <!-- 钓鱼小游戏 -->
  <div id="fishing" class="hidden">
    <canvas id="fish-canvas" width="220" height="300"></canvas>
    <div id="fish-tip">按住 / 触摸屏幕 抬起鱼钩，让鱼保持在框内！</div>
  </div>

  <!-- 提示气泡 -->
  <div id="toasts"></div>

  <!-- 交互提示 -->
  <div id="tile-hint" class="hidden"></div>

  <!-- 开始画面 -->
  <div id="start-screen">
    <canvas id="start-canvas" width="480" height="270"></canvas>
    <div id="start-title">
      <h1>微光谷物语</h1>
      <p class="en">GLIMMER VALE</p>
      <p class="sub">— 像素农场生活模拟 —</p>
    </div>
    <div id="start-btns">
      <button id="btn-new" class="menu-btn">🌱 新的旅程</button>
      <button id="btn-continue" class="menu-btn hidden">📖 继续旅程</button>
      <button id="btn-help" class="menu-btn small">玩法说明</button>
    </div>
    <p id="start-foot">原创像素游戏 · 键盘 WASD/方向键移动 · 触屏虚拟摇杆</p>
  </div>
</div>
<script>
/* ============ 微光谷物语 · 数据层 ============ */
window.G = window.G || {};
(function () {
  'use strict';
  G.TS = 16;                      // 瓦片像素
  G.SPRING = 0; G.SUMMER = 1; G.FALL = 2; G.WINTER = 3;
  G.SEASON_NAMES = ['春', '夏', '秋', '冬'];
  G.SEASON_COLORS = {
    grassA: ['#5f9e3e', '#4f9438', '#a5813c', '#cfd8dc'],
    grassB: ['#6fb04a', '#5aa243', '#b28e46', '#dde3e6'],
    leaf:   ['#71b04e', '#4f9438', '#d08a3a', null],
    water:  ['#3f76b5', '#3f76b5', '#3e6ea8', '#7fa7c9'],
  };
  G.WEATHER_NAMES = { sun: '☀️ 晴', cloud: '☁️ 多云', rain: '🌧️ 雨', storm: '⛈️ 暴雨', snow: '❄️ 雪' };

  /* ---------------- 作物 ---------------- */
  // stage 图: 0 种子 1 幼苗 2 生长 3 成熟
  G.CROPS = {
    turnip:  { name: '小萝卜', seasons: [0], days: 4, seed: 'turnip_seed',  sell: 35,  seedCost: 20, color: '#e86379' },
    potato:  { name: '土豆',   seasons: [0], days: 6, seed: 'potato_seed',  sell: 75,  seedCost: 50, color: '#cfa763' },
    tomato:  { name: '番茄',   seasons: [1], days: 5, seed: 'tomato_seed',  sell: 65,  seedCost: 42, color: '#e0453a' },
    melon:   { name: '西瓜',   seasons: [1], days: 7, seed: 'melon_seed',   sell: 140, seedCost: 85, color: '#3f9e4d' },
    pumpkin: { name: '南瓜',   seasons: [2], days: 7, seed: 'pumpkin_seed', sell: 175, seedCost: 105, color: '#e08a2d' },
    snowfl:  { name: '雪绒花', seasons: [3], days: 5, seed: 'snowfl_seed',  sell: 95,  seedCost: 58, color: '#bcd9ff' },
  };

  /* ---------------- 物品 ---------------- */
  const I = (id, name, cat, sell, desc) => ({ id, name, cat, sell, desc });
  G.ITEMS = {};
  [
    // 工具
    I('axe', '斧头', 'tool', 0, '砍伐树桩与树木，获得木头。'),
    I('pick', '十字镐', 'tool', 0, '敲碎石块，获得石头。'),
    I('hoe', '锄头', 'tool', 0, '清理杂草、开垦农田。'),
    I('can', '水壶', 'tool', 0, '给作物浇水，作物每天需要水。'),
    I('rod', '鱼竿', 'tool', 0, '在湖边或码头钓鱼。'),
    // 材料
    I('wood', '木头', 'mat', 3, '建造设施的基本材料。'),
    I('stone', '石头', 'mat', 3, '结实的建筑材料。'),
    I('fiber', '纤维', 'mat', 2, '搓绳子的好材料。'),
    // 种子（由作物表生成）

    for (let j = 0; j < 6; j++) {
      const inset = Math.max(0, 4 - j);
      x.fillRect(inset + 2, j, 30 - inset * 2, 1);
    }
    // 墙体
    x.fillStyle = '#d9b98a'; x.fillRect(2, 10, 30, 18);
    x.fillStyle = '#c4a273';
    for (let j = 12; j < 28; j += 5) x.fillRect(2, j, 30, 1);
    x.fillStyle = '#8a6a42'; x.fillRect(2, 28, 30, 2);
    // 门洞 + 坡道
    x.fillStyle = '#3a2c1a'; x.fillRect(13, 17, 8, 11);
    x.fillStyle = '#5a4028'; x.fillRect(15, 19, 4, 2);
    x.fillStyle = '#a5793c'; x.fillRect(12, 27, 10, 3);
    x.fillStyle = '#7c5a2e';
    for (let i = 12; i < 22; i += 3) x.fillRect(i, 27, 1, 3);
    // 窗
    x.fillStyle = '#2a2018'; x.fillRect(5, 13, 6, 6); x.fillRect(23, 13, 6, 6);
    x.fillStyle = '#ffe98a'; x.fillRect(6, 14, 4, 4); x.fillRect(24, 14, 4, 4);
    // 描边
    x.strokeStyle = '#2a2018'; x.strokeRect(2.5, 10.5, 29, 18); x.strokeRect(1.5, 5.5, 31, 5);
    return c;
  }

  /* ---------------- 建筑（生成式） ---------------- */
  function buildingSprite(style, w, h) {
    const W = w * TS, H = h * TS;
    const roofH = Math.floor(H * 0.42);
    const { c, x } = cv(W, H + roofH + 2);
    // 墙
    x.fillStyle = style.wall; x.fillRect(0, roofH, W, H);
    x.fillStyle = style.wallLine;
    for (let j = roofH + 7; j < roofH + H; j += 8) x.fillRect(2, j, W - 4, 1);
    x.fillStyle = '#00000022';
    x.fillRect(0, roofH, W, 2);
    x.fillStyle = '#8a8a8a'; // 石基
    for (let i = 0; i < W; i += 8) { x.fillStyle = i % 16 ? '#9a948a' : '#8a857c'; x.fillRect(i, roofH + H - 5, 7, 5); }
    x.fillStyle = '#2a2018'; x.fillRect(0, roofH + H - 6, W, 1);
    // 屋顶（梯形）
    for (let j = 0; j < roofH; j++) {
      const t = j / roofH;
      const inset = Math.floor((1 - t) * (W * 0.18));
      x.fillStyle = j < 2 ? style.roofDark : style.roof;
      x.fillRect(inset - 2, j, W - inset * 2 + 4, 1);
      if (j > roofH - 6) { x.fillStyle = style.roofDark; x.fillRect(inset - 4, j, W - inset * 2 + 8, 1); }
    }
    x.fillStyle = '#00000033';
    x.fillRect(0, roofH - 1, W, 3);
    // 脊线
    x.fillStyle = style.roofDark; x.fillRect(W * 0.32, 0, W * 0.36, 2);
    // 烟囱
    if (style.chimney) { x.fillStyle = '#7a5a48'; x.fillRect(W - 14, 2, 7, 12); x.fillStyle = '#5a4034'; x.fillRect(W - 15, 1, 9, 3); }
    // 门
    const doorX = Math.floor(W * 0.28), doorY = roofH + H - 24;
    x.fillStyle = '#2a2018'; x.fillRect(doorX - 1, doorY - 1, 16, 25);
    x.fillStyle = style.door; x.fillRect(doorX, doorY, 14, 24);
    x.fillStyle = '#00000033'; x.fillRect(doorX + 9, doorY, 5, 24);
    x.fillStyle = '#e8c56a'; x.fillRect(doorX + 10, doorY + 12, 2, 2);
    // 窗（两个）
    const wins = [[Math.floor(W * 0.08), roofH + 10], [Math.floor(W * 0.74), roofH + 10]];
    wins.forEach(([wx, wy]) => {
      x.fillStyle = '#2a2018'; x.fillRect(wx - 1, wy - 1, 13, 13);
      x.fillStyle = '#8a6a42'; x.fillRect(wx, wy, 11, 11);
      x.fillStyle = '#bfe3ff'; x.fillRect(wx + 1, wy + 1, 9, 9);
      x.fillStyle = '#8a6a42'; x.fillRect(wx + 5, wy, 1, 11); x.fillRect(wx, wy + 5, 11, 1);
    });
    // 门牌小图标
    if (style.signIcon) {
      const sx = Math.floor(W * 0.52), sy = roofH + 12;
      x.fillStyle = '#5a4028'; x.fillRect(sx, sy, 12, 14);
      x.fillStyle = '#e8d9b0'; x.fillRect(sx + 1, sy + 1, 10, 10);
      x.fillStyle = style.signIcon;
      disc(x, sx + 5, sy + 6, 3, style.signIcon);
    }
    return { cv: c, glow: wins.map(([wx, wy]) => ({ x: wx, y: wy, w: 11, h: 11 })), doorY: roofH };
  }

  /* ---------------- 作物阶段 ---------------- */
  function cropStages(color) {
    const stages = [];
    // 0 播种
    let { c, x } = cv(TS, TS);
    x.fillStyle = '#3a2a18';
    x.fillRect(5, 10, 2, 1); x.fillRect(9, 11, 2, 1); x.fillRect(7, 8, 2, 1);
    x.fillStyle = '#6b4a2a'; x.fillRect(6, 9, 4, 2);
    stages.push(c);
    // 1 发芽（加高更醒目）
    ({ c, x } = cv(TS, TS));
    x.fillStyle = '#4a7d2e';
    x.fillRect(7, 7, 2, 6);
    x.fillStyle = '#5f9e3e';
    x.fillRect(4, 7, 3, 2); x.fillRect(9, 7, 3, 2);
    x.fillStyle = '#71b04e';
    x.fillRect(6, 5, 4, 2);
    x.fillStyle = '#8fd45a';
    x.fillRect(7, 4, 2, 1);
    stages.push(c);
    // 2 生长
    ({ c, x } = cv(TS, TS));
    x.fillStyle = '#4a7d2e';
    x.fillRect(7, 5, 2, 8);
    x.fillStyle = '#5f9e3e';
    x.fillRect(3, 6, 4, 2); x.fillRect(9, 6, 4, 2);
    x.fillRect(2, 9, 3, 2); x.fillRect(11, 9, 3, 2);
    x.fillStyle = '#71b04e'; x.fillRect(6, 4, 4, 2);
    stages.push(c);
    // 3 成熟（带果实）
    ({ c, x } = cv(TS, TS));
    x.fillStyle = '#4a7d2e';
    x.fillRect(7, 3, 2, 6);
    x.fillStyle = '#5f9e3e';
    x.fillRect(2, 4, 4, 2); x.fillRect(10, 4, 4, 2);
    disc(x, 7, 9, 4, color);
    x.fillStyle = '#00000044'; x.fillRect(4, 11, 8, 1);
    x.fillStyle = '#ffffffaa'; x.fillRect(5, 7, 2, 2);
    stages.push(c);
    // 枯萎
    ({ c, x } = cv(TS, TS));
    x.fillStyle = '#8a7a5a';
    x.fillRect(7, 8, 2, 5);
    x.fillStyle = '#6a5a3a';
    x.fillRect(4, 8, 3, 1); x.fillRect(9, 7, 3, 1);
    x.fillRect(5, 6, 2, 1); x.fillRect(10, 5, 2, 1);
    x.fillStyle = '#4a4030'; x.fillRect(6, 12, 4, 1);
    stages.push(c);
    return stages;
  }

  /* ---------------- 瓦片 ---------------- */
  function tileGrass(season, variant) {
    const A = G.SEASON_COLORS.grassA[season], B = G.SEASON_COLORS.grassB[season];
    const dark = ['#4a7d2e', '#3f6d28', '#8a6a2e', '#a8b4ba'][season];
    const { c, x } = cv(TS, TS);
    x.fillStyle = variant ? A : B; x.fillRect(0, 0, TS, TS);
    for (let i = 0; i < 7; i++) {
      const rx = Math.floor(hash(i * 13 + variant, season * 7 + i) * TS);
      const ry = Math.floor(hash(i * 7 + variant * 3, i * 17 + season) * TS);
      x.fillStyle = dark; x.fillRect(rx, ry, 1, 2);
    }
    if (season === 0 && variant === 2) { x.fillStyle = '#f0d0e0'; x.fillRect(4, 5, 1, 1); x.fillRect(10, 10, 1, 1); x.fillStyle = '#ffe98a'; x.fillRect(11, 4, 1, 1); }
    if (season === 2 && variant === 1) { x.fillStyle = '#d97f2a'; x.fillRect(5, 8, 1, 1); x.fillRect(12, 3, 1, 1); }
    if (season === 3 && variant === 3) { x.fillStyle = '#ffffff'; x.fillRect(6, 6, 2, 1); x.fillRect(2, 12, 2, 1); }
    return c;
  }
  function tilePath(season) {
    const { c, x } = cv(TS, TS);
    x.fillStyle = '#d8c08a'; x.fillRect(0, 0, TS, TS);
    for (let i = 0; i < 6; i++) {
      const rx = Math.floor(hash(i * 3, i * 11) * TS), ry = Math.floor(hash(i * 5, i * 2) * TS);
      x.fillStyle = i % 2 ? '#c4a878' : '#e5d2a5'; x.fillRect(rx, ry, 2, 1);
    }
    x.fillStyle = '#b89a68'; x.fillRect(3, 7, 2, 2); x.fillRect(11, 12, 2, 1);
    return c;
  }
  function tileWater(frame, season) {
    const base = G.SEASON_COLORS.water[season];
    const { c, x } = cv(TS, TS);
    x.fillStyle = base; x.fillRect(0, 0, TS, TS);
    x.fillStyle = '#00000022';
    for (let i = 0; i < 4; i++) {
      const rx = Math.floor(hash(i * 7, i) * TS), ry = Math.floor(hash(i, i * 5) * TS);
      x.fillRect(rx, ry, 3, 1);
    }
    x.fillStyle = '#ffffff55';
    const off = frame * 4;
    x.fillRect((2 + off) % TS, 3, 4, 1); x.fillRect((9 + off) % TS, 9, 5, 1); x.fillRect((5 + off) % TS, 14, 3, 1);
    return c;
  }
  function tileSoil(wet) {
    const { c, x } = cv(TS, TS);
    x.fillStyle = wet ? '#5a3f28' : '#8a6a42'; x.fillRect(0, 0, TS, TS);
    // 土块噪点 + 浅沟，弱化"木板"感
    for (let i = 0; i < 9; i++) {
      const rx = Math.floor(hash(i * 13, i * 7) * TS), ry = Math.floor(hash(i * 5, i * 17) * TS);
      x.fillStyle = wet ? '#4a3320' : '#77573a'; x.fillRect(rx, ry, 2, 1);
    }
    for (let i = 0; i < 6; i++) {
      const rx = Math.floor(hash(i * 3 + 5, i * 11 + 1) * TS), ry = Math.floor(hash(i * 19, i * 3 + 9) * TS);
      x.fillStyle = wet ? '#6b4d30' : '#9a7a50'; x.fillRect(rx, ry, 1, 1);
    }
    x.fillStyle = wet ? '#4a3320' : '#77573a';
    x.fillRect(0, 5, TS, 1); x.fillRect(0, 11, TS, 1);
    return c;
  }
  function tilePier() {
    const { c, x } = cv(TS, TS);
    x.fillStyle = '#b08a5a'; x.fillRect(0, 0, TS, TS);
    x.fillStyle = '#8a6a42'; x.fillRect(0, 4, TS, 1); x.fillRect(0, 10, TS, 1);
    x.fillStyle = '#9a7a50'; x.fillRect(0, 1, TS, 1); x.fillRect(0, 7, TS, 1); x.fillRect(0, 13, TS, 1);
    x.fillStyle = '#2a2018'; x.fillRect(2, 0, 1, TS); x.fillRect(12, 0, 1, TS);
    return c;
  }
  function tileFloor() {
    const { c, x } = cv(TS, TS);
    x.fillStyle = '#c9a878'; x.fillRect(0, 0, TS, TS);
    x.fillStyle = '#b08a5a'; x.fillRect(0, 7, TS, 1);
    x.fillStyle = '#d8bc90'; x.fillRect(0, 2, TS, 1); x.fillRect(0, 11, TS, 1);
    x.fillStyle = '#a5793c'; x.fillRect(5, 0, 1, 7); x.fillRect(11, 8, 1, 8);
    return c;
  }
  function tileWall() {
    const { c, x } = cv(TS, TS);
    x.fillStyle = '#e8dcc0'; x.fillRect(0, 0, TS, TS);
    x.fillStyle = '#d0c0a0'; x.fillRect(0, 12, TS, 4);
    x.fillStyle = '#bfa878'; x.fillRect(0, 12, TS, 1);
    x.fillStyle = '#00000011'; x.fillRect(0, 5, TS, 1);
    return c;
  }
  function tileRug() {
    const { c, x } = cv(TS, TS);
    x.fillStyle = '#b5533c'; x.fillRect(0, 0, TS, TS);
    x.fillStyle = '#e0a04a'; x.fillRect(1, 1, TS - 2, TS - 2);
    x.fillStyle = '#b5533c'; x.fillRect(3, 3, TS - 6, TS - 6);
    x.fillStyle = '#e0a04a'; x.fillRect(6, 6, 4, 4);
    return c;
  }

  /* ---------------- 物品图标 ---------------- */
  function iconSeed(color) {

    x.fillStyle = '#b89a68'; x.fillRect(3, 3, 10, 2); x.fillRect(3, 12, 10, 2);
    x.fillStyle = '#2a2018'; x.strokeStyle = '#2a2018'; x.strokeRect(3.5, 3.5, 9, 10);
    x.fillStyle = color; x.fillRect(6, 7, 4, 4);
    x.fillStyle = '#ffffff88'; x.fillRect(6, 7, 2, 2);
    return c;
  }
  function iconCircle(color, dark, leafy) {
    const { c, x } = cv(TS, TS);
    disc(x, 8, 9, 5, color);
    x.fillStyle = dark; x.fillRect(4, 12, 9, 1);
    x.fillStyle = '#ffffffaa'; x.fillRect(6, 6, 2, 2);
    if (leafy) { x.fillStyle = '#4a7d2e'; x.fillRect(7, 3, 2, 3); x.fillRect(5, 2, 3, 2); }

  }
  function iconFish(color, fin) {
    const { c, x } = cv(TS, TS);
    x.fillStyle = color;
    x.fillRect(4, 8, 8, 3); x.fillRect(5, 7, 6, 5); x.fillRect(6, 6, 4, 7);
    x.fillStyle = fin; x.fillRect(12, 7, 3, 5); x.fillRect(6, 4, 3, 2); x.fillRect(6, 12, 3, 2);
    x.fillStyle = '#2a2018'; x.fillRect(5, 8, 1, 1);
    x.fillStyle = '#ffffff99'; x.fillRect(6, 7, 3, 1);

  function iconTool(kind) {
    const { c, x } = cv(TS, TS);
    const wood = '#a5793c', iron = '#b8bcc4', ironD = '#8a8f96';
    if (kind === 'axe') {
      x.fillStyle = wood; x.fillRect(7, 4, 2, 10);

      x.fillStyle = ironD; x.fillRect(9, 4, 2, 3);
    } else if (kind === 'pick') {
      x.fillStyle = wood; x.fillRect(7, 4, 2, 10);
      x.fillStyle = iron; x.fillRect(3, 3, 10, 2); x.fillRect(2, 4, 3, 2); x.fillRect(11, 4, 3, 2);
    } else if (kind === 'hoe') {
      x.fillStyle = wood; x.fillRect(7, 3, 2, 11);
      x.fillStyle = iron; x.fillRect(4, 2, 5, 2); x.fillRect(4, 3, 2, 3);
    } else if (kind === 'can') {
      x.fillStyle = '#4f9ea0'; x.fillRect(4, 6, 8, 7); x.fillRect(2, 7, 2, 2);
      x.fillStyle = '#3a7a7c'; x.fillRect(4, 12, 8, 1); x.fillRect(12, 5, 1, 4);
      x.fillStyle = '#7cc4c6'; x.fillRect(5, 7, 3, 1);
      x.fillStyle = '#4f9ea0'; x.fillRect(11, 10, 3, 1); x.fillRect(13, 9, 1, 2);
    } else if (kind === 'rod') {
      x.fillStyle = wood; x.fillRect(8, 4, 2, 10);
      x.fillStyle = '#b8bcc4'; x.fillRect(9, 2, 1, 3);
      x.fillStyle = '#e8e8e8'; x.fillRect(11, 5, 2, 2);
      x.fillStyle = '#d9453a'; x.fillRect(11, 7, 1, 3);

    return c;
  }
  function iconSimple(id) {

    if (id === 'wood') {

      x.fillStyle = '#d9b98a'; x.fillRect(2, 6, 3, 4); x.fillStyle = '#a5793c'; disc(x, 3, 8, 1, '#c9a06a');
    } else if (id === 'stone') {
      disc(x, 8, 9, 5, '#9aa0a8'); disc(x, 6, 7, 2, '#c8ccd2'); x.fillStyle = '#6e737a'; x.fillRect(4, 12, 9, 1);
    } else if (id === 'fiber') {

      x.fillStyle = '#e0d080'; x.fillRect(7, 4, 2, 8);
    } else if (id === 'berry') {
      disc(x, 6, 9, 3, '#e0453a'); disc(x, 10, 8, 3, '#c93830'); disc(x, 8, 11, 2, '#e0453a');
      x.fillStyle = '#4a7d2e'; x.fillRect(7, 4, 2, 3); x.fillStyle = '#ffffffaa'; x.fillRect(5, 8, 1, 1); x.fillRect(9, 7, 1, 1);

      x.fillStyle = '#7a9a5a'; x.fillRect(8, 3, 2, 2);
    } else if (id === 'mushroom') {
      disc(x, 8, 7, 4, '#c9453a'); x.fillStyle = '#f0e8e0'; x.fillRect(7, 8, 3, 6); x.fillStyle = '#ffffff'; x.fillRect(6, 5, 2, 2); x.fillRect(10, 6, 1, 1);
    } else if (id === 'sprinkler') {

      x.fillStyle = '#5a4028'; x.fillRect(3, 4, 1, 2); x.fillRect(12, 4, 1, 2);

  /* ---------------- 汇总 ---------------- */

        p.x += dx / d * sp; p.y += dy / d * sp;

        p.t += dt * 8; p.frame = Math.floor(p.t) % 2 ? (Math.floor(p.t / 2) % 2 ? 1 : 2) : 0;
      } else { p.dir = 'down'; p.frame = 0; }
    });
  }
  G.npcPos = npcPos;

  /* ================= 面向瓦片与交互 ================= */
  G.facingTile = function () {
    const st = G.state;
    const fx = st.dir === 'left' ? -1 : st.dir === 'right' ? 1 : 0;
    const fy = st.dir === 'up' ? -1 : st.dir === 'down' ? 1 : 0;
    return {
      x: Math.floor((st.px + fx * TS * 0.9) / TS),
      y: Math.floor((st.py + fy * TS * 0.9 + 2) / TS),
    };
  };
  G.facingNPC = function () {
    const st = G.state, t = G.facingTile();
    for (const n of G.NPCS) {
      const p = npcPos[n.id];
      if (!p || p.map !== st.map) continue;
      const nx = Math.floor(p.x / TS), ny = Math.floor(p.y / TS);
      if (nx === t.x && ny === t.y) return n;
      // 也允许玩家与NPC重叠时交互
      if (nx === Math.floor(st.px / TS) && ny === Math.floor(st.py / TS)) return n;
    }
    return null;
  };

  function talk(npc) {
    const st = G.state;
    st.talkedUnique[npc.id] = 1;
    const s = G.npcSlot(npc, st.minute);
    const greeted = st.npcGreeted[npc.id] === st.day + st.year * 1000;
    let text;
    if (s.greet && !greeted) { text = s.greet; st.npcGreeted[npc.id] = st.day + st.year * 1000; }
    else text = npc.lines[Math.floor(rng() * npc.lines.length)];
    // 任务相关提示
    const hints = {
      greg: ['清理农场杂物、种下作物，任务都在日志里 (J)。', '恢复小镇的每一步都算数！'],
      martha: ['店里营业时间 8:00-20:00 哦。', '下雨天不用浇水~'],
      zhou: ['带着木头来找我，能建不少好东西。', '栈桥修好后能去深水区钓鱼。'],
      hai: ['鱼上钩时浮标会闪，手要快！', '深水区的鱼更值钱。'],
      lily: ['野花…可以送给我吗？嘿嘿。', '听说月圆夜有金色的鱼！'],
    };
    if (rng() < 0.35 && hints[npc.id]) text = hints[npc.id][Math.floor(rng() * hints[npc.id].length)];
    G.UI.dialog(npc.name, text);
    G.sfx('talk');
    checkQuests();
  }

  function facingIsLogpile(t) {
    return (G.MAPS.forest.props || []).some(p => p.type === 'logpile' && p.x === t.x && p.y === t.y);
  }

  function interactBuilding(b) {
    const st = G.state;
    if (b.type === 'home') { G.UI.transition(() => { st.map = 'home'; st.px = 5 * TS + 8; st.py = 6 * TS + 12; G.unstick(); }); return true; }
    if (b.type === 'shop') {
      if (st.minute >= 480 && st.minute < 1200) G.UI.openPanel('shop');
      else G.UI.dialog('玛莎杂货店', '打烊了～营业时间是 8:00-20:00。');
      return true;
    }
    if (b.type === 'sawmill') { G.UI.openPanel('build'); return true; }
    if (b.type === 'mayor') { G.UI.dialog('镇长家', '门锁着。格雷戈里一般上午在广场。'); return true; }
    if (b.type === 'cottage') { G.UI.dialog('民居', '主人出远门了，门口的风信子开得正好。'); return true; }
    return false;
  }

  /* ================= 工具行为 ================= */
  function farmTileAt(t) {
    const st = G.state;
    if (st.map !== 'farm') return null;
    return st.farmTiles[t.x + ',' + t.y] || null;
  }

  function clearObject(t, ft) {
    const st = G.state, k = t.x + ',' + t.y;
    delete st.farmTiles[k];
    st.stats.cleared++;
    checkQuests();
  }

  function doTool() {
    const st = G.state;
    if (G.placing) { cancelPlace(); return; }
    const t = G.facingTile();
    const m = G.MAPS[st.map];
    if (t.x < 0 || t.y < 0 || t.x >= m.w || t.y >= m.h) return;
    const terr = m.terrain[t.y][t.x];
    const ft = farmTileAt(t);
    const tool = st.handTool;

    if (tool === 'hoe') {
      if (ft && ft.crop && ft.crop.dead) { if (!useEnergy(1)) return; delete st.farmTiles[t.x + ',' + t.y]; G.sfx('dig'); particles(t.x, t.y, '#8a7a5a'); return; }
      if (ft && ft.o === 'weed') { if (!useEnergy(2)) return; clearObject(t, ft); if (rng() < 0.5) { addItem('fiber', 1); G.UI.toast('+1 纤维', ''); } G.sfx('dig'); particles(t.x, t.y, '#6aa84f'); return; }
      if (!ft && st.map === 'farm' && (terr === '.' || terr === ',')) { if (!useEnergy(2)) return; st.farmTiles[t.x + ',' + t.y] = { tilled: 1 }; G.sfx('dig'); particles(t.x, t.y, '#8a6a42'); return; }
      G.UI.toast('这里不能锄地（农场空地才可以）', ''); G.sfx('error'); return;
    }
    if (tool === 'axe') {
      if (ft && ft.o === 'tree') { if (!useEnergy(3)) return; ft.hp--; G.sfx('chop'); particles(t.x, t.y, '#71b04e'); if (ft.hp <= 0) { clearObject(t, ft); addItem('wood', 3); G.UI.toast('+3 木头', 'good'); } else G.UI.toast('树：还差 ' + ft.hp + ' 斧', ''); return; }
      if (ft && ft.o === 'stump') { if (!useEnergy(2)) return; clearObject(t, ft); addItem('wood', 1); G.sfx('chop'); particles(t.x, t.y, '#b08a5a'); G.UI.toast('+1 木头', 'good'); return; }
      if (st.map === 'forest' && facingIsLogpile(t)) {
        if (st.foragePicked['logpile'] === st.day + st.year * 1000) { G.UI.toast('木堆明天才会补上', ''); return; }
        if (!useEnergy(3)) return;
        st.foragePicked['logpile'] = st.day + st.year * 1000;
        addItem('wood', 3); G.sfx('chop'); particles(t.x, t.y, '#b08a5a');
        G.UI.toast('+3 木头', 'good'); checkQuests(); return;
      }
      G.UI.toast('（斧头：砍树/树桩/木堆）', ''); return;
    }
    if (tool === 'pick') {
      if (ft && ft.o === 'rock') { if (!useEnergy(3)) return; ft.hp--; G.sfx('chop'); particles(t.x, t.y, '#c8ccd2'); if (ft.hp <= 0) { clearObject(t, ft); addItem('stone', 2); G.UI.toast('+2 石头', 'good'); } else G.UI.toast('石头：还差 ' + ft.hp + ' 镐', ''); return; }
      if (ft && !ft.o) { delete st.farmTiles[t.x + ',' + t.y]; G.sfx('dig'); particles(t.x, t.y, '#8a6a42'); return; } // 铲掉耕地
      G.UI.toast('（十字镐：敲碎石块）', ''); return;
    }
    if (tool === 'can') {
      if (ft && ft.tilled) {
        if (ft.wet) { G.UI.toast('这块地已经湿润了', ''); return; }
        if (!useEnergy(1)) return;
        ft.wet = 1; G.sfx('water'); particles(t.x, t.y, '#5fb8e8');
        return;
      }
      G.UI.toast('（水壶：浇灌开垦过的土地）', ''); return;
    }
    if (tool === 'rod') {
      if (terr === 'w') { startFishing(t); return; }
      G.UI.toast('面向水面才能抛竿', ''); G.sfx('error'); return;
    }
  }
  G.doTool = doTool;

  /* ================= 互动（A键） ================= */
  function doInteract() {
    const st = G.state;
    if (G.placing) { tryPlace(); return; }
    const t = G.facingTile();
    const m = G.MAPS[st.map];
    if (t.x < 0 || t.y < 0 || t.x >= m.w || t.y >= m.h) return;

    // NPC优先
    const npc = G.facingNPC();
    if (npc) { talk(npc); return; }

    // 建筑
    const b = (m.buildings || []).find(b => t.x >= b.x && t.x < b.x + b.w && t.y >= b.y && t.y < b.y + b.h);
    if (b) {
      if (b.door && t.x === b.door.x && t.y === b.door.y) { interactBuilding(b); return; }
      if (interactBuilding(b)) return;
    }

    // 静态道具
    const prop = (m.props || []).find(p => {
      if (p.type === 'rug') return false;
      const pw = p.w || 1, ph = p.h || 1;
      return t.x >= p.x && t.x < p.x + pw && t.y >= p.y && t.y < p.y + ph;
    });
    if (prop) {
      if (prop.type === 'bed') { G.UI.confirmSleep(); return; }
      if (prop.type === 'sign') { G.UI.dialog('告示牌', prop.text); return; }
      if (prop.type === 'bin') { G.UI.openPanel('sell-bin'); return; }
      if (prop.type === 'logpile') { G.UI.toast('用斧头砍木堆获得木头', ''); return; }
    }

    // 森林觅食
    if (st.map === 'forest') {
      const spot = (G.MAPS.forest.forageSpots || []).find(s => s.x === t.x && s.y === t.y);
      if (spot) {
        const key = 'f' + spot.x + ',' + spot.y;
        const picked = st.foragePicked[key] === st.day + st.year * 1000;
        const type = forageType(spot);
        if (picked) { G.UI.toast('明天才会再长出来…', ''); return; }
        addItem(type, 1);
        st.foragePicked[key] = st.day + st.year * 1000;
        G.sfx('pick'); particles(t.x, t.y, '#8fd45a');
        G.UI.toast('+1 ' + G.ITEMS[type].name, 'good');
        return;
      }
    }

    // 农场作物
    const ft = farmTileAt(t);
    if (ft && ft.crop && !ft.crop.dead && ft.crop.prog >= G.CROPS[ft.crop.id].days) {
      const c = G.CROPS[ft.crop.id];
      if (!useEnergy(1)) return;
      const bonus = rng() < 0.12 ? 2 : 1;
      addItem(c.seed.replace('_seed', ''), bonus);
      delete st.farmTiles[t.x + ',' + t.y];
      st.stats.harvested += bonus;
      G.sfx('pick'); particles(t.x, t.y, c.color);
      G.UI.toast('收获 ' + c.name + ' ×' + bonus + '！', 'good');
      checkQuests();
      return;
    }

    // 手持物品
    if (st.handItem) {
      const it = G.ITEMS[st.handItem];
      if (it.cat === 'seed') { plantSeed(t, ft); return; }
      if (G.EATABLE.includes(st.handItem)) {
        const e = G.EAT_ENERGY[st.handItem];
        takeItem(st.handItem, 1);
        G.gainEnergy(e);
        G.sfx('eat');
        G.UI.toast('吃了 ' + it.name + '，体力 +' + e, 'good');
        return;
      }
    }
    G.UI.toast('（没有可互动的目标）', '');
  }
  G.doInteract = doInteract;

  function plantSeed(t, ft) {
    const st = G.state;
    const cid = G.ITEMS[st.handItem].cropId;
    const c = G.CROPS[cid];
    if (!ft || !ft.tilled || ft.crop) { G.UI.toast('需要先锄好一块空地', ''); G.sfx('error'); return; }
    if (!c.seasons.includes(st.season)) { G.UI.toast(c.name + '不适合在' + G.SEASON_NAMES[st.season] + '天种植', 'bad'); G.sfx('error'); return; }
    if (!useEnergy(1)) return;
    takeItem(st.handItem, 1);
    ft.crop = { id: cid, prog: 0 };
    st.stats.planted++;
    G.sfx('plant'); particles(t.x, t.y, c.color);
    checkQuests();
  }

  function forageType(spot) {
    const idx = G.MAPS.forest.forageSpots.indexOf(spot);
    if (idx % 2 === 0) {
      const s = G.state.season;
      return s === 2 ? 'mushroom' : s === 3 ? 'winterroot' : 'berry';
    }
    return 'flower';
  }
  function isForageAt(x, y) {
    if (G.state.map !== 'forest') return null;
    const spot = G.MAPS.forest.forageSpots.find(s => s.x === x && s.y === y);
    if (!spot) return null;
    return forageType(spot);
  }

  /* ================= 建造 ================= */
  G.placing = null;
  G.startPlace = function (type) {
    G.placing = { type };
    G.UI.closePanel();
    G.UI.toast('移动选择位置，按 互动 放置 / 工具 取消', '');
  };
  function cancelPlace() { G.placing = null; G.UI.toast('已取消建造', ''); }

  G.placeValid = function (type, tx, ty) {
    const st = G.state, m = G.MAPS.farm;
    if (st.map !== 'farm') return false;
    const def = G.BUILDS[type];
    if (type === 'bridge') {
      if (st.built.bridge) return false;
      return G.MAPS.lake.bridgeTiles.some(b => b.x === tx && b.y === ty);
    }
    const w = def.w || 1, h = def.h || 1;
    for (let y = ty; y < ty + h; y++) for (let x = tx; x < tx + w; x++) {
      if (x >= m.w || y >= m.h) return false;
      const terr = m.terrain[y][x];
      if (terr !== '.' && terr !== ',') return false;
      if (st.farmTiles[x + ',' + y]) return false;
      if (m.buildings.some(b => x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h)) return false;
      if (m.props.some(p => p.type !== 'rug' && x >= p.x && x < p.x + (p.w || 1) && y >= p.y && y < p.y + (p.h || 1))) return false;
    }
    return true;
  };

  function tryPlace() {
    const st = G.state;
    if (!G.placing) return;
    const type = G.placing.type, def = G.BUILDS[type];
    const t = G.facingTile();
    if (!G.placeValid(type, t.x, t.y)) { G.UI.toast('这里不能放置', 'bad'); G.sfx('error'); return; }
    const cost = def.cost;
    if (st.gold < cost.gold) { G.UI.toast('金币不足（需要 ' + cost.gold + '金）', 'bad'); G.sfx('error'); return; }
    if (cost.wood && !hasItem('wood', cost.wood)) { G.UI.toast('木头不足（需要 ' + cost.wood + '个）', 'bad'); G.sfx('error'); return; }
    st.gold -= cost.gold;
    if (cost.wood) takeItem('wood', cost.wood);
    if (type === 'bridge') {
      st.built.bridge = true;
      G.UI.toast('🌉 栈桥修好了！深水区开放！', 'good');
      G.UI.dayLogLine('修复了湖边栈桥');
    } else {
      st.placed.push({ type, x: t.x, y: t.y });
      G.UI.toast('建造了' + def.name + '！', 'good');
      G.UI.dayLogLine('建造了' + def.name);
    }
    st.stats.built++;
    G.sfx('build');
    G.placing = null;
    checkQuests(); G.UI.refreshHUD();
  }

  /* ================= 钓鱼 ================= */
  const fish = { active: false, phase: '', timer: 0, fishY: 50, barY: 120, barV: 0, prog: 0, deep: false, t: 0 };
  G.fishing = fish;

  function startFishing(t) {
    const st = G.state;
    if (!useEnergy(6)) return;
    fish.active = true;
    fish.phase = 'wait';
    fish.timer = 1 + rng() * 2.5;
    fish.deep = st.map === 'lake' && t.x >= 22 && t.y >= 16;
    fish.prog = 0.35;
    fish.barY = Math.max(6, Math.min(236 - 42, fish.fishY - 21));
    fish.barV = 0; fish.t = 0;
    fish.fishY = 60 + rng() * 100;
    fish.barY = Math.max(6, Math.min(236 - 42, fish.fishY - 21));
    G.sfx('cast');
    G.UI.showFishing(true);
    G.UI.fishMsg(fish.deep ? '深水区…有大家伙的动静！' : '抛竿…等待鱼儿上钩');
  }

  function fishPress() {
    if (!fish.active) return;
    if (fish.phase === 'wait') {
      if (fish.bite) { fish.phase = 'reel'; fish.timer = 7; G.sfx('biteset'); G.UI.fishMsg('咬钩了！保持鱼在框内！'); }
      else G.UI.fishMsg('还没动静…耐心等浮标下沉');
    }
  }
  G.fishPress = fishPress;
  G.fishHold = (on) => { fish.holding = on; };

  function updateFishing(dt) {
    if (!fish.active) return;
    fish.t += dt;
    if (fish.phase === 'wait') {
      if (!fish.bite) {
        fish.timer -= dt;
        if (fish.timer <= 0) {
          fish.bite = true; fish.timer = 0.8;
          G.sfx('bite'); G.UI.fishMsg('❗ 快按 互动/空格 提竿！');
        }
      } else {
        fish.timer -= dt;
        if (fish.timer <= 0) endFishing(false, '鱼跑掉了…（要在浮标闪烁时提竿）');
      }
      if (fish.t > 10) endFishing(false, '等太久了…换个位置试试');
      return;
    }
    if (fish.phase === 'reel') {
      fish.timer -= dt;
      // 鱼
      if (rng() < dt * 1.6) fish.fishVY = (rng() - 0.5) * 160;
      if (rng() < dt * 0.35) fish.fishVY = (rng() < 0.5 ? -1 : 1) * (90 + rng() * 90);
      fish.fishY += (fish.fishVY || 0) * dt;
      fish.fishY = Math.max(14, Math.min(210, fish.fishY));
      // 鱼筐
      fish.barV += (fish.holding ? -900 : 900) * dt;
      fish.barV = Math.max(-260, Math.min(260, fish.barV));
      fish.barY += fish.barV * dt;
      const H = 42;
      if (fish.barY < 6) { fish.barY = 6; fish.barV = 0; }
      if (fish.barY > 236 - H) { fish.barY = 236 - H; fish.barV = 0; }
      const inBox = fish.fishY > fish.barY + 2 && fish.fishY < fish.barY + H - 2;
      fish.prog += (inBox ? 0.34 : -0.22) * dt;
      if (fish.prog >= 1) {
        const pool = G.FISH_TABLE.filter(f => fish.deep ? f.w[1] > 0 && f.min <= 1 : f.w[0] > 0 && f.min === 0);
        let total = 0; const ws = pool.map(f => { const w = fish.deep ? f.w[1] : f.w[0]; total += w; return w; });
        let r = rng() * total, pick = pool[0];
        for (let i = 0; i < pool.length; i++) { r -= ws[i]; if (r <= 0) { pick = pool[i]; break; } }
        addItem(pick.id, 1);
        G.state.stats.fish++;
        G.sfx('catch');
        endFishing(true, '钓到了【' + G.ITEMS[pick.id].name + '】！', pick.id);
        checkQuests();
      } else if (fish.prog <= 0 || fish.timer <= 0) {
        endFishing(false, '鱼挣脱了…再试一次！');
      }
    }
  }
  function endFishing(ok, msg, itemId) {
    fish.active = false; fish.bite = false;
    G.UI.showFishing(false);
    G.UI.toast((ok ? '🎣 ' : '') + msg, ok ? 'good' : 'bad');
    if (ok && itemId) G.UI.dayLogLine('钓到 ' + G.ITEMS[itemId].name);
    if (ok) G.UI.settleable = true;
  }
  G.updateFishing = updateFishing;

  /* ================= 粒子与音效 ================= */
  const parts = [];
  function particles(tx, ty, color) {
    for (let i = 0; i < 8; i++) {
      parts.push({
        x: tx * TS + 8, y: ty * TS + 8, vx: (rng() - 0.5) * 60, vy: -rng() * 60 - 20,
        life: 0.5 + rng() * 0.3, color, s: 1 + Math.floor(rng() * 2),
      });
    }
  }
  G.particles = parts;

  // 极简WebAudio音效
  let AC = null, muted = false;
  G.toggleMute = function () { muted = !muted; return muted; };
  G.sfx = function (name) {
    if (muted) return;
    try {
      if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === 'suspended') AC.resume();
      const t = AC.currentTime;
      const o = AC.createOscillator(), g = AC.createGain();
      o.connect(g); g.connect(AC.destination);
      const conf = {
        dig: ['square', 120, 0.08, 0.12], chop: ['sawtooth', 90, 0.1, 0.14],
        water: ['sine', 500, 0.15, 0.1], plant: ['sine', 700, 0.06, 0.12],
        pick: ['sine', 880, 0.07, 0.1], coin: ['square', 980, 0.06, 0.12],
        error: ['sawtooth', 140, 0.15, 0.1], talk: ['sine', 440, 0.05, 0.08],
        eat: ['sine', 300, 0.1, 0.1], cast: ['sine', 600, 0.12, 0.08],
        bite: ['square', 1200, 0.09, 0.14], biteset: ['square', 800, 0.08, 0.12],
        catch: ['square', 660, 0.1, 0.16], build: ['square', 300, 0.15, 0.14],
        sleep: ['sine', 520, 0.3, 0.12],
      }[name] || ['sine', 440, 0.05, 0.05];
      o.type = conf[0];
      o.frequency.setValueAtTime(conf[1], t);
      if (name === 'coin' || name === 'catch' || name === 'sleep') o.frequency.setValueAtTime(conf[1] * 1.5, t + 0.08);
      g.gain.setValueAtTime(conf[3], t);
      g.gain.exponentialRampToValueAtTime(0.001, t + conf[2]);
      o.start(t); o.stop(t + conf[2] + 0.05);
    } catch (e) { }
  };

  /* ================= 主更新 ================= */
  G.update = function (dt) {
    if (!G.running) return;
    if (fish.active) { updateFishing(dt); return; }
    if (G.paused) return;
    const st = G.state;
    if (fish.active) { updateFishing(dt); return; }
    // 时间
    st.minute += MIN_PER_SEC * dt;
    if (st.minute >= DAY_END) {
      G.UI.toast('你累倒了…被送回了床上（体力恢复减少）', 'bad');
      st.map = 'farm'; st.px = 6 * TS + 8; st.py = 7 * TS + 12;
      G.unstick();
      sleepNow(true);
      return;
    }

  function drawMiniMap() {
    const cvEl = $('#mini-map');
    if (!cvEl) return;
    const ctx = cvEl.getContext('2d');
    const st = G.state, m = G.MAPS[st.map];
    const scale = Math.min(cvEl.width / m.w, cvEl.height / m.h);
    const ox = (cvEl.width - m.w * scale) / 2, oy = (cvEl.height - m.h * scale) / 2;
    ctx.fillStyle = '#171208'; ctx.fillRect(0, 0, cvEl.width, cvEl.height);
    const colors = { '.': '#5f9e3e', ',': '#4a7d2e', p: '#d8c08a', w: '#3f76b5', P: '#b08a5a', f: '#c9a878', W: '#8a7a5a' };
    if (st.season === 2) { colors['.'] = '#a5813c'; colors[','] = '#8a6a2e'; }
    if (st.season === 3) { colors['.'] = '#cfd8dc'; colors[','] = '#b8c4ca'; }
    for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
      ctx.fillStyle = colors[m.terrain[y][x]] || '#5f9e3e';
      ctx.fillRect(ox + x * scale, oy + y * scale, scale + 0.5, scale + 0.5);
    }
    // 出口标记
    ctx.fillStyle = '#ffd964';
    (m.exits || []).forEach(e => ctx.fillRect(ox + e.x * scale - 1, oy + e.y * scale - 1, e.w * scale + 2, e.h * scale + 2));
    // 建筑
    ctx.fillStyle = '#b5533c';
    (m.buildings || []).forEach(b => ctx.fillRect(ox + b.x * scale, oy + b.y * scale, b.w * scale, b.h * scale));
    // NPC
    G.NPCS.forEach(n => {
      const slot = G.npcSlot(n, st.minute);
      if (!slot.map || slot.map !== st.map) return;
      ctx.fillStyle = n.shirt;
      ctx.beginPath(); ctx.arc(ox + (slot.x + 0.5) * scale, oy + (slot.y + 0.5) * scale, Math.max(2.5, scale * 0.4), 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
    });
    // 玩家
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#2a2018';
    const px = ox + st.px / TS * scale, py = oy + st.py / TS * scale;
    ctx.beginPath(); ctx.arc(px, py, Math.max(3, scale * 0.45), 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // 标签
    ctx.fillStyle = '#ffe9b8'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(m.name, cvEl.width / 2, oy + m.h * scale + 14);
    ctx.textAlign = 'left';
  }

  /* ================= 面向提示 ================= */
  UI.updateHint = function () {
    const st = G.state;
    if (!st || G.paused) { $('#tile-hint').classList.add('hidden'); return; }
    const t = G.facingTile();
    const m = G.MAPS[st.map];
    if (t.x < 0 || t.y < 0 || t.x >= m.w || t.y >= m.h) { $('#tile-hint').classList.add('hidden'); return; }
    let txt = null;
    const npc = G.facingNPC();
    if (npc) txt = '💬 ' + npc.name;
    else {
      const b = (m.buildings || []).find(b => t.x >= b.x && t.x < b.x + b.w && t.y >= b.y && t.y < b.y + b.h);
      const labels = { home: '🏠 进屋', shop: '🏪 杂货店', sawmill: '🔨 锯木场', mayor: '镇长家', cottage: '民居' };
      if (b) txt = labels[b.type] || null;
      if (!txt) {
        const prop = (m.props || []).find(p => p.type !== 'rug' && t.x >= p.x && t.x < p.x + (p.w || 1) && t.y >= p.y && t.y < p.y + (p.h || 1));
        if (prop) {
          const pl = { bin: '🧺 出货箱', bed: '🛏️ 睡觉', sign: '📢 查看告示牌', logpile: '🪵 斧头砍木堆', well: '⛲ 老井' };
          txt = pl[prop.type] || null;
        }
      }
      if (!txt && st.map === 'forest') {
        const spot = G.MAPS.forest.forageSpots.find(s => s.x === t.x && s.y === t.y);
        if (spot && st.foragePicked['f' + t.x + ',' + t.y] !== st.day + st.year * 1000) {
          txt = '✋ 采摘 ' + (G.MAPS.forest.forageSpots.indexOf(spot) % 2 === 0
            ? (st.season === 2 ? '蘑菇' : st.season === 3 ? '雪参' : '野莓') : '野花');
        }
      }
      if (!txt) {
        const ft = st.farmTiles && st.farmTiles[t.x + ',' + t.y];
        if (ft && ft.crop && !ft.crop.dead && ft.crop.prog >= G.CROPS[ft.crop.id].days) txt = '🥬 收获 ' + G.CROPS[ft.crop.id].name;
        else if (st.handItem && G.ITEMS[st.handItem] && G.ITEMS[st.handItem].cat === 'seed' && ft && ft.tilled && !ft.crop) txt = '🌱 播种 ' + G.ITEMS[st.handItem].name;
        else if (st.handTool === 'rod') {
          const terr = m.terrain[t.y][t.x];
          if (terr === 'w') txt = '🎣 抛竿钓鱼';
        }
      }
    }
    const el = $('#tile-hint');
    if (txt) {
      const scale = G.view.scale;
      el.textContent = txt;
      el.style.left = ((st.px - G._cam.x) * scale) + 'px';
      el.style.top = ((st.py - 30 - G._cam.y) * scale) + 'px';
      el.classList.remove('hidden');
    } else el.classList.add('hidden');
  };

    G.paused = on;
  };
  UI.fishMsg = function (t) { $('#fish-tip').textContent = t; };
  UI.drawFishing = function (ctx) {
    const cvEl = $('#fish-canvas');
    const x = cvEl.getContext('2d');
    const W = cvEl.width, H = cvEl.height;
    x.fillStyle = '#1d3040'; x.fillRect(0, 0, W, H);
    x.fillStyle = 'rgba(255,255,255,0.06)';
    for (let j = 0; j < H; j += 12) x.fillRect(0, j + (Math.floor(performance.now() / 300) % 2) * 2, W, 1);
    // 进度
    x.fillStyle = '#0e1620'; x.fillRect(10, 6, W - 20, 10);
    x.fillStyle = '#8fd45a'; x.fillRect(11, 7, (W - 22) * Math.max(0, Math.min(1, G.fishing.prog)), 8);
    x.fillStyle = '#0e1620'; x.fillRect(10, 20, W - 20, 4);
    x.fillStyle = '#e0453a'; x.fillRect(11, 21, (W - 22) * Math.max(0, Math.min(1, G.fishing.timer / 7)), 2);
    // 鱼
    const fy = G.fishing.fishY;
    x.fillStyle = G.fishing.deep ? '#e8d05a' : '#7cc4e8';
    x.fillRect(24, fy - 4, 14, 8);
    x.fillRect(20, fy - 2, 4, 4);
    x.fillRect(36, fy - 3, 3, 6);
    x.fillStyle = '#2a2018'; x.fillRect(26, fy - 2, 2, 2);
    // 等待期：浮标与涟漪动画
    if (G.fishing.phase === 'wait' && !G.fishing.bite) {
      const bob = Math.sin(performance.now() / 240) * 2;
      const bx = 96 + Math.sin(performance.now() / 600) * 24, by = 130 + bob;
      x.strokeStyle = 'rgba(255,255,255,0.35)';
      x.lineWidth = 1;
      const rip = 4 + (performance.now() / 300 % 1) * 14;
      x.beginPath(); x.arc(bx, by, rip, 0, Math.PI * 2); x.stroke();
      x.fillStyle = '#e0453a'; x.fillRect(bx - 3, by - 6 + bob, 6, 6);
      x.fillStyle = '#f5f0e0'; x.fillRect(bx - 2, by + bob, 4, 3);
      x.fillStyle = 'rgba(255,255,255,0.6)';
      x.font = '11px sans-serif'; x.textAlign = 'center';
      x.fillText('等待鱼儿咬钩…', W / 2, 90);
    }
    // 鱼框
    const by = G.fishing.barY, BH = 42;
    x.strokeStyle = G.fishing.holding ? '#8fd45a' : '#e8e8e8';
    x.lineWidth = 2;
    x.strokeRect(18, by, 24, BH);
    x.fillStyle = 'rgba(143,212,90,0.18)';
    x.fillRect(19, by + 1, 22, BH - 2);
    // 咬钩提示
    if (G.fishing.bite && G.fishing.phase === 'wait') {
      x.fillStyle = '#e0453a';
      x.font = 'bold 28px sans-serif'; x.textAlign = 'center';
      x.fillText('!', W / 2, 60 + Math.sin(performance.now() / 80) * 4);
    }
    x.fillStyle = 'rgba(255,255,255,0.5)';
    x.font = '10px sans-serif'; x.textAlign = 'center';
    x.fillText(G.fishing.deep ? '🌊 深水区' : '🌤️ 浅水区', W / 2, H - 10);
  };

  /* ================= 触屏控件 ================= */
  function setupTouch() {
    const base = $('#joy-base'), stick = $('#joy-stick');
    let pid = null;
    const setStick = (dx, dy) => {
      stick.style.left = (32 + dx * 34) + 'px';
      stick.style.top = (32 + dy * 34) + 'px';
    };
    base.addEventListener('pointerdown', (e) => {
      pid = e.pointerId;
      base.setPointerCapture(pid);
      e.preventDefault();
    });
    base.addEventListener('pointermove', (e) => {
      if (e.pointerId !== pid) return;
      const r = base.getBoundingClientRect();
      let dx = (e.clientX - r.left - r.width / 2) / (r.width / 2);
      let dy = (e.clientY - r.top - r.height / 2) / (r.height / 2);
      const mag = Math.hypot(dx, dy);
      if (mag > 1) { dx /= mag; dy /= mag; }
      G.input.jx = Math.abs(dx) > 0.18 ? dx : 0;
      G.input.jy = Math.abs(dy) > 0.18 ? dy : 0;
      setStick(dx, dy);
      e.preventDefault();
    });
    const endJoy = (e) => {
      if (e.pointerId !== pid) return;
      pid = null;
      G.input.jx = 0; G.input.jy = 0;
      setStick(0, 0);
    };
    base.addEventListener('pointerup', endJoy);
    base.addEventListener('pointercancel', endJoy);

    $('#btn-act').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (isFishingOpen()) { G.fishPress(); G.fishHold(true); return; }
      if (UI.advanceDialog()) return;
      if (G.running) G.doInteract();
    });
    $('#btn-act').addEventListener('pointerup', () => G.fishHold(false));
    $('#btn-tool').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (G.running) G.doTool();
    });
    $('#fishing').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      G.fishPress(); G.fishHold(true);
    });
    $('#fishing').addEventListener('pointerup', () => G.fishHold(false));
    $('#fishing').addEventListener('pointerleave', () => G.fishHold(false));
  }

  /* ================= 键盘 ================= */
  function setupKeys() {
    window.addEventListener('keydown', (e) => {
      if (e.repeat && !['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd', 'W', 'A', 'S', 'D'].includes(e.key)) return;
      const k = e.key;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(k)) e.preventDefault();
      const st = G.state;
      switch (k) {
        case 'w': case 'W': case 'ArrowUp': G.input.up = 1; break;
        case 's': case 'S': case 'ArrowDown': G.input.down = 1; break;
        case 'a': case 'A': case 'ArrowLeft': G.input.left = 1; break;
        case 'd': case 'D': case 'ArrowRight': G.input.right = 1; break;
        case ' ': case 'Enter': case 'e': case 'E':
          if (UI.advanceDialog()) return;
          if (isFishingOpen()) { G.fishPress(); G.fishHold(true); return; }
          if (G.running) G.doInteract();
          break;
        case 'f': case 'F':
          if (G.running && !G.paused) G.doTool();
          break;
        case 'i': case 'I': if (G.running) UI.openPanel('bag'); break;
        case 'j': case 'J': if (G.running) UI.openPanel('quests'); break;
        case 'm': case 'M': if (G.running) UI.openPanel('map'); break;
        case 'Escape':
          if (G.placing) { G.placing = null; UI.toast('已取消建造', ''); return; }
          if (!panelType) UI.openPanel('menu');
          else if (panelType !== 'settle' && panelType !== 'ending') UI.closePanel();
          break;
        case '1': case '2': case '3': case '4': case '5':
          if (st) { st.handTool = TOOLS[parseInt(k) - 1]; UI.refreshHotbar(); }
          break;
      }
    });
    window.addEventListener('keyup', (e) => {
      const k = e.key;
      switch (k) {
        case 'w': case 'W': case 'ArrowUp': G.input.up = 0; break;
        case 's': case 'S': case 'ArrowDown': G.input.down = 0; break;
        case 'a': case 'A': case 'ArrowLeft': G.input.left = 0; break;
        case 'd': case 'D': case 'ArrowRight': G.input.right = 0; break;
        case ' ': case 'Enter': case 'e': case 'E': G.fishHold(false); break;
      }
    });
  }

  /* ================= HUD按钮 ================= */
  function setupButtons() {
    $('#btn-bag').addEventListener('pointerdown', () => UI.openPanel('bag'));
    $('#btn-quest').addEventListener('pointerdown', () => UI.openPanel('quests'));
    $('#btn-map').addEventListener('pointerdown', () => UI.openPanel('map'));
    $('#btn-menu').addEventListener('pointerdown', () => UI.openPanel('menu'));
  }

  /* ================= 开始画面 ================= */
  UI.showTitle = function () {
    G.running = false;
    $('#start-screen').classList.remove('hidden');
    $('#hud').classList.add('hidden');
    $('#hotbar').classList.add('hidden');
    $('#joystick').classList.add('hidden');
    $('#action-btns').classList.add('hidden');
    UI.closePanel();
    $('#btn-continue').classList.toggle('hidden', !G.hasSave());
  };
  UI.hideTitle = function () {
    $('#start-screen').classList.add('hidden');
    $('#hud').classList.remove('hidden');
    $('#hotbar').classList.remove('hidden');
    document.body.classList.add('touch-ui');
    if (document.body.classList.contains('touch-ui')) {
      $('#joystick').classList.remove('hidden');
      $('#action-btns').classList.remove('hidden');
    }
    G.running = true;
  };

  UI.startGame = function (isNew) {
    if (isNew || !G.load()) G.newGame();
    G.unstick();
    UI.refreshHUD();
    UI.refreshHotbar();
    UI.hideTitle();
    if (isNew && !G.state.flags.intro) {
      G.state.flags.intro = 1;
      G.save(true);
      const intro = [
        ['镇长格雷戈里', '孩子，你爷爷留下的农场就在镇西边。杂草丛生，但土地肥沃得很！'],
        ['镇长格雷戈里', '屋里有一把锄头、水壶、斧头、镐和鱼竿，杂货店玛莎那儿能买到种子。'],
        ['镇长格雷戈里', '先用锄头清理杂物、开垦几块地种下去吧！累了就回家上床睡觉。有事随时按 J 看任务日志！'],
      ];
      let i = 0;
      const next = () => {
        if (i < intro.length) { UI.dialog(intro[i][0], intro[i][1], next); i++; }
        else { UI.toast('提示：面向地块按 互动/空格 使用物品，按 F/工具 使用工具', ''); }
      };
      next();
    } else {
      UI.toast('欢迎回来，' + G.SEASON_NAMES[G.state.season] + G.state.day + '日 · ' + G.WEATHER_NAMES[G.state.weather], 'good');
    }
  };

  UI.setup = function () {
    setupTouch();
    setupKeys();
    setupButtons();
    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
      document.getElementById('start-foot').textContent = '📱 触屏：左侧摇杆移动 · 「互动 / 工具」按钮操作 · 自动保存';
    }
    $('#btn-new').addEventListener('click', () => UI.startGame(true));
    $('#btn-continue').addEventListener('click', () => UI.startGame(false));
    $('#btn-help').addEventListener('click', () => UI.openPanel('help'));
  };

  window.addEventListener('visibilitychange', () => { if (document.hidden && G.running) G.save(true); });
})();

;
/* ============ 微光谷物语 · 主入口 ============ */
window.G = window.G || {};
(function () {
  'use strict';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let lastT = 0;

  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    // 选择整数缩放：保证视野至少 22x12 瓦片，桌面更大视野
    let scale = Math.max(2, Math.floor(Math.min(vw / (21 * 16), vh / (13 * 16))));
    if (vw / scale < 15 * 16) scale = 2;
    G.view.scale = scale;
    G.view.w = Math.ceil(vw / scale);
    G.view.h = Math.ceil(vh / scale);
    canvas.width = G.view.w;
    canvas.height = G.view.h;
    ctx.imageSmoothingEnabled = false;
  }
  window.addEventListener('resize', resize);

  function loop(t) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
    lastT = t;
    if (G.running && G.state) {
      G.update(dt);
      G.render(ctx, dt);
      G._cam && G.UI.updateHint();
      if (G.fishing.active) G.UI.drawFishing(ctx);
    } else if (!G.running) {
      drawStartBg(ctx, t / 1000);
    }
  }

  // 标题背景：缓动的像素农场小景
  function drawStartBg(ctx, time) {
    const w = canvas.width, h = canvas.height;
    const sc = document.getElementById('start-canvas');
    if (!sc) return;
    if (sc.width !== w || sc.height !== h) { sc.width = w; sc.height = h; }
    const x = sc.getContext('2d');
    x.imageSmoothingEnabled = false;
    // 天空渐变（黄昏→夜循环缓慢变化）
    const ph = (Math.sin(time * 0.05) + 1) / 2;
    const sky = x.createLinearGradient(0, 0, 0, h * 0.6);
    sky.addColorStop(0, ph > 0.5 ? '#2b3a66' : '#ffb36b');
    sky.addColorStop(1, ph > 0.5 ? '#3f5a8a' : '#e88a5a');
    x.fillStyle = sky; x.fillRect(0, 0, w, h * 0.6);
    // 太阳/月亮
    const cx = w * 0.75, cy = h * 0.18 + Math.sin(time * 0.05) * 4;
    x.fillStyle = ph > 0.5 ? '#e8ecf2' : '#ffd964';
    x.fillRect(cx - 6, cy - 6, 12, 12);
    x.fillRect(cx - 8, cy - 2, 16, 4); x.fillRect(cx - 2, cy - 8, 4, 16);
    // 远山与树林
    x.fillStyle = '#3f5a3a'; x.fillRect(0, h * 0.42, w, h * 0.1);
    x.fillStyle = '#33492f'; x.fillRect(0, h * 0.5, w, h * 0.2);
    for (let i = 0; i < 14; i++) {
      const tx = (i * 37 + 10) % w;
      x.fillStyle = i % 3 === 0 ? '#2a3d26' : '#3a5232';
      x.fillRect(tx, h * 0.38 + (i % 3) * 3, 10, 16);
      x.fillRect(tx + 3, h * 0.36 + (i % 3) * 3, 4, 4);
    }
    // 农田
    x.fillStyle = '#5f9e3e'; x.fillRect(0, h * 0.62, w, h * 0.38);
    x.fillStyle = '#8a6a42';
    for (let r = 0; r < 3; r++) x.fillRect(w * 0.1 + r * 26, h * 0.7 + r * 8, 120, 6);
    // 小房子
    x.fillStyle = '#d9b98a'; x.fillRect(w * 0.16, h * 0.56, 40, 26);
    x.fillStyle = '#b5533c';
    for (let j = 0; j < 10; j++) { const ins = Math.max(0, 6 - j); x.fillRect(w * 0.16 - ins, h * 0.56 - 10 + j, 40 + ins * 2, 2); }
    x.fillStyle = '#5a3a20'; x.fillRect(w * 0.16 + 16, h * 0.56 + 14, 8, 12);
    x.fillStyle = '#ffe98a'; x.fillRect(w * 0.16 + 4, h * 0.56 + 6, 6, 6); x.fillRect(w * 0.16 + 30, h * 0.56 + 6, 6, 6);
    // 烟囱烟雾
    const smoke = (time * 10) % 30;
    x.fillStyle = 'rgba(240,240,240,0.5)';
    x.fillRect(w * 0.16 + 46, h * 0.56 - 14 - smoke, 4, 4);
    // 飘云
    for (let i = 0; i < 4; i++) {
      const cxx = ((time * (6 + i * 2) + i * 90) % (w + 60)) - 30;
      x.fillStyle = ph > 0.5 ? 'rgba(200,210,230,0.5)' : 'rgba(255,235,210,0.7)';
      x.fillRect(cxx, h * 0.12 + i * 14, 26, 6); x.fillRect(cxx + 6, h * 0.12 + i * 14 - 4, 14, 4);
    }
  }

  function boot() {
    G.buildSprites();
    resize();
    G.UI.setup();
    G.UI.showTitle();
    requestAnimationFrame(loop);
  }
  boot();
})();

</script>
